<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- Security: the page may only load its own files. Keep this in step if
       the game ever loads something from another address (CLAUDE.md). -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; media-src 'self' blob:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; upgrade-insecure-requests">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#141413">
  <title>Funded</title>
  <meta name="description" content="Funded: a roguelike prop-firm trading game by Longlight Interactive.">
  <link rel="preload" as="font" type="font/woff2" href="assets/fonts/space-grotesk-latin.woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css">
  <link rel="preload" as="image" href="assets/wide.jpg">
  <link rel="preload" as="image" href="assets/desk.jpg">
</head>
<body>
  <main class="frame" id="frame">
    <img class="bg bg-wide" id="bgWide" src="assets/wide.jpg" alt="">
    <video class="bg bg-intro" id="bgIntro" muted playsinline preload="auto" aria-hidden="true"></video>
    <img class="bg bg-desk" id="bgDesk" src="assets/desk.jpg" alt="">
    <img class="bg bg-tod" id="bgAm" alt="">
    <img class="bg bg-tod" id="bgPm" alt="">
    <img class="bg bg-alt" id="bgAlt" alt="">
    <div class="rain" id="rain" aria-hidden="true"></div>
    <div class="desk-mouse" id="deskMouse" aria-hidden="true"></div>
    <div class="props" id="props" aria-hidden="true"></div>

    <!-- Top monitor: market -->
    <section class="screen screen-top" id="screenTop" aria-label="Market">
      <header class="mkt-head">
        <span class="sym" id="sym">----</span>
        <span class="px" id="px">0.00</span>
        <span class="chg" id="chg"></span>
        <span class="spacer"></span>
        <span class="clock" id="clock">9:30</span>
        <span class="daynum" id="dayNum">Day 1 of 5</span>
        <button class="pause-btn" id="pauseBtn" aria-label="Pause"><i></i><i></i></button>
      </header>
      <div class="chart-wrap">
        <canvas id="chart"></canvas>
        <div class="news-banner" id="newsBanner" hidden></div>
        <div class="bell" id="bell" hidden></div>
        <div class="l2" id="l2" hidden></div>
        <div class="opt" id="opt" hidden></div>
      </div>
      <div class="paused" id="paused" hidden>
        <div class="paused-title">Paused</div>
        <div class="paused-sub">Tap to resume</div>
      </div>
    </section>

    <!-- Bottom monitor: desk -->
    <section class="screen screen-bottom" id="screenBottom" aria-label="Desk">
      <div class="acct">
        <span>BAL <b id="bal">$25,000</b></span>
        <span>DAY <b id="dayPnl">$0</b></span>
      </div>
      <div class="meters">
        <div class="meter" id="mLoss"><div class="m-label"><span>LOSS</span><b>0%</b></div><div class="m-bar"><i></i></div></div>
        <div class="meter" id="mDd"><div class="m-label"><span>DD</span><b>0%</b></div><div class="m-bar"><i></i></div></div>
        <div class="meter target" id="mTgt"><div class="m-label"><span>TGT</span><b>0%</b></div><div class="m-bar"><i></i></div></div>
      </div>
      <div class="pos" id="pos">FLAT</div>
      <div class="sizes" id="sizes" role="radiogroup" aria-label="Order size"></div>
      <div class="actions">
        <button class="act buy" id="buyBtn">BUY</button>
        <button class="act sell" id="sellBtn">SELL</button>
        <button class="act flat" id="flatBtn">FLATTEN</button>
      </div>
    </section>

    <!-- Touch screens: the pointer that clicks what you tap (js/clicker.js) -->
    <div class="pointer" id="pointer" aria-hidden="true"></div>

    <!-- Tutorial coach bubble -->
    <div class="coach" id="coach" hidden>
      <div class="coach-text" id="coachText"></div>
      <button class="coach-next" id="coachNext">Next</button>
    </div>

    <!-- Full-frame cards: title, day open, summary, fired, pass -->
    <div class="card-layer" id="cardLayer" hidden>
      <div class="card" id="card"></div>
    </div>
  </main>
  <script type="module" src="js/main.js"></script>
</body>
</html>
